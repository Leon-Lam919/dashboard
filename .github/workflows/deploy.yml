name: Deploy to Pi

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Deploy to Raspberry Pi
        run: |
          ssh pi@${{ secrets.PI_IP }} "cd ~/dashboard && git pull && docker compose down && docker compose up -d --build"

