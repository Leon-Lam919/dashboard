services:
  backend:
    build:
      context: ./backend
    enviromment:
      - TZ=America/Chicago
    container_name: dashboard-backend
    restart: always
    ports:
      - "4000:4000"  # only internal network
    networks:
      - dashboard-net

  frontend:
    build:
      context: ./frontend
    container_name: dashboard-frontend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - dashboard-net

networks:
  dashboard-net:
    driver: bridge
